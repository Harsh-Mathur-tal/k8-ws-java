apiVersion: v1
kind: Service
metadata:
  name: inventory-sevice-nodeport-service
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
    - protocol: TCP
      port: 8082       # The port that the service will expose inside the cluster
      targetPort: 8082  # The port on the container where NGINX is running
      nodePort: 30006 # The port on the node (or Codespace) that will be exposed externally